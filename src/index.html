<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎬 Catálogo de Filmes</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <h1>🎬 Catálogo de Filmes</h1>
        
        <div class="form-container">
            <h2 id="form-title">Adicionar Novo Filme</h2>
            <form id="filme-form">
                <input type="hidden" id="filme-id">
                
                <div class="form-group">
                    <label for="titulo">Título:</label>
                    <input type="text" id="titulo" required placeholder="Digite o título do filme">
                </div>
                
                <div class="form-group">
                    <label for="diretor">Diretor:</label>
                    <input type="text" id="diretor" required placeholder="Nome do diretor">
                </div>
                
                <div class="form-group">
                    <label for="estudio">Estúdio:</label>
                    <input type="text" id="estudio" required placeholder="Estúdio ou produtora">
                </div>
                
                <div class="form-group">
                    <label for="ano">Ano:</label>
                    <input type="number" id="ano" required placeholder="Ano de lançamento">
                </div>
                
                <div class="form-group">
                    <label for="preco">Preço:</label>
                    <input type="number" id="preco" step="0.01" required placeholder="0.00">
                </div>
                
                <div class="button-group">
                    <button type="submit" class="btn btn-primary">Salvar</button>
                    <button type="button" id="btn-cancelar" class="btn btn-secondary" style="display:none;">Cancelar</button>
                </div>
            </form>
        </div>
        
        <div class="table-container">
            <h2>Filmes Cadastrados</h2>
            <div class="search-bar">
                <input type="text" id="search" placeholder="Pesquisar por título ou diretor...">
            </div>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Título</th>
                        <th>Diretor</th>
                        <th>Estúdio</th>
                        <th>Ano</th>
                        <th>Preço</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="filmes-table-body">
                </tbody>
            </table>
            <div id="no-data" style="display:none;">Nenhum filme cadastrado.</div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
